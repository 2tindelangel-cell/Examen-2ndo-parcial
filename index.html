<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo telefonico</title>
    <style>
        body{
            background-color: rgba(20, 245, 110, 0.845);
        }
        h1 b{
            text-shadow: -3px 4px 4px blue;
        }
    </style>
    <script>
        alert('Saludos al hermoso mundo que me vio nacer');
    </script>
</head>
<body>
    <h1><b>Recibo telefonico</b></h1>
    <br>
    <hr>
    <form action="" method="get">
    <label for="Minutos">
        Minutos de llamada a celular: (1.00 c/u)
    </label>
    <input type="number">
    <hr>
    <br>
    <h2><b>Tipo de plan</b></h2>
    <input type="radio">
    <label for="solo telefonico">
            Solo telefono (200.00)
    </label>
    <br>
    <input type="radio">
    <label for="telefono+Internet">
        Telefono+Internet (450.00)
    </label>
    <br>
    <input type="radio">
    <label for="Telefono+Internet+Tv">
        Telefono+Internet+TV (850.00)
    </label>
    <br>
    <hr>
    <h3><b>Otros Servicios</b></h3>
    <input type="checkbox">
    <label for="Antivirus">
        Antivirus (30.00)
    </label>
    <br>
    <input type="checkbox">
    <label for="Servicios de nube">
        Servicios de nube (50.00)
    </label>
    <br>
    <input type="checkbox">
    <label for="Servicios web">
        Servicios web (40.00)
    </label>
    <br>
    <hr>
    <h4><b>Paquetes</b></h4>
    <label for="Paquetes"></label>
    <select name="Paquetes" id="Paquetes">
    <option value="1">Seleccionar una opción</option>
    <option value="2">Residencial +0%</option>
    <option value="3">Ejecutivo</option>
    <option value="4">Familiar</option>
    </select>
    <br>
     <input type="submit" value="Calcular Recibo" style="margin-bottom: 8px;">

</body>
</html>
